name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qookix-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
          - platform: windows-latest
            artifact: windows
          - platform: macos-latest
            artifact: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/installer-ui -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        run: npm install

      # Decode the Authenticode certificate (base64 -> .pfx). Skipped when the
      # secret is empty; code signing is then a no-op.
      - name: Decode code signing certificate
        if: runner.os == 'Windows' && env.QOOKIX_CERT_PFX_B64 != ''
        shell: bash
        env:
          QOOKIX_CERT_PFX_B64: ${{ secrets.QOOKIX_CERT_PFX_B64 }}
        run: |
          echo "$QOOKIX_CERT_PFX_B64" | base64 -d > "$RUNNER_TEMP/qookix.pfx"
          test -s "$RUNNER_TEMP/qookix.pfx"

      # `npm run tauri build` runs the run-tauri.mjs wrapper: it builds the
      # WebView2 installer UI, embeds it, and (on Windows) signs the main exe /
      # installer / MSI. When TAURI_SIGNING_PRIVATE_KEY is set, the bundler
      # ALSO emits minisign `.sig` files for the updater artifacts, which the
      # publish job turns into latest.json.
      - name: Build Tauri app
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          QOOKIX_CERT_PFX: ${{ runner.temp }}/qookix.pfx
          QOOKIX_CERT_PASSWORD: ${{ secrets.QOOKIX_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Extra Windows asset: a portable zip (the standalone exe) for users who
      # prefer not to run an installer.
      - name: Create portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/qookix-launcher.exe"
          if (-not (Test-Path $exe)) { throw "Binary not found: $exe" }
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "QookiX Launcher") | Out-Null
          Copy-Item $exe (Join-Path $stage "QookiX Launcher\") -Force
          $outDir = "src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "QookiX_${ver}_x64_portable.zip"
          Compress-Archive -Path (Join-Path $stage "QookiX Launcher") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Collect release artifacts
        shell: bash
        run: |
          # Copy ONLY the real release artifacts (installers, updater bundles,
          # signatures, portable zip) into dist-artifacts/. The raw
          # `bundle/**/*` glob also contains AppImage/AppDir staging files
          # (lib*.so, im-*.so, .desktop, copyright, data.tar.gz, the bare
          # binary, icon.icns, ...) which must NOT be published.
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -maxdepth 5 -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.app.tar.gz' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \
            -o -name '*.exe' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp -n {} dist-artifacts/ \;
          echo "--- collected artifacts ---"
          ls -la dist-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QookiX-${{ matrix.artifact }}
          path: dist-artifacts

  # Assemble the GitHub Release once, after every platform finished. Downloads
  # all build artifacts (installers + updater bundles + `.sig` signatures),
  # generates the Tauri updater `latest.json` from local files, then publishes
  # everything in ONE `softprops/action-gh-release` call — the battle-tested
  # action that robustly creates/updates the release without the fragile manual
  # `gh release create/upload` dance that caused stale-release 404s.
  verify-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fail fast: a failure here (e.g. no signed bundles, or an unexpected
      # artifact layout) MUST fail the job, not silently ship a broken manifest.
      - name: Generate update manifest (latest.json)
        run: |
          node scripts/create-update-manifest-local.mjs release "${GITHUB_REF_NAME}" latest.json

      # Build a human-friendly release body: a per-platform download table whose
      # links point at the actual artifacts about to be published, so users can
      # grab the right installer directly from the release page.
      - name: Generate release notes (download table)
        run: |
          node scripts/generate-release-notes.mjs release "${GITHUB_REF_NAME}" body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*
          body_path: body.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Rebuild latest.json from the release's REAL asset URLs (via the GitHub
      # API) and overwrite the placeholder generated above. This guarantees the
      # manifest always points at assets that actually exist on the release,
      # regardless of how Tauri names bundles (e.g. "QookiX Launcher" vs
      # "QookiX.Launcher" — Tauri replaces spaces with dots). Otherwise a
      # mismatched asset name makes the updater hit a 404 and every auto-update
      # fails.
      - name: Rebuild latest.json from published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          node scripts/fix-update-manifest.mjs


