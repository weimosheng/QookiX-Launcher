name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qookix-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 主应用与 installer-ui 共用一个 target 目录，避免 GUI 依赖编译两遍
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target-shared
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # 质量关：tests + clippy 只在 Linux 跑一次，与三个平台的构建并行
  check:
    name: Tests & Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-shared

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-webkit-ubuntu2204-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-webkit-ubuntu2204-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      # java_detection_report 测试需要 JVM
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 只告警不阻断，为日后 -D warnings 做准备
      - name: Clippy (advisory)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
          - platform: windows-latest
            artifact: windows
          - platform: macos-latest
            artifact: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # sccache 不限定 git ref，跨版本标签也能复用依赖编译产物
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # 只缓存 cargo registry/git checkout，避免重复下载 880 个 crate
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-shared

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-webkit-ubuntu2204-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-webkit-ubuntu2204-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "NSIS already present: $((Get-Command makensis).Source)"
          } else {
            choco install nsis -y --no-progress
          }

      - name: Install frontend dependencies
        run: npm ci

      # secret 为空时跳过，代码签名自动成为空操作
      - name: Decode code signing certificate
        if: runner.os == 'Windows' && env.QOOKIX_CERT_PFX_B64 != ''
        shell: bash
        env:
          QOOKIX_CERT_PFX_B64: ${{ secrets.QOOKIX_CERT_PFX_B64 }}
        run: |
          echo "$QOOKIX_CERT_PFX_B64" | base64 -d > "$RUNNER_TEMP/qookix.pfx"
          test -s "$RUNNER_TEMP/qookix.pfx"

      - name: Build Tauri app
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          QOOKIX_CERT_PFX: ${{ runner.temp }}/qookix.pfx
          QOOKIX_CERT_PASSWORD: ${{ secrets.QOOKIX_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 编译期注入存储桶更新源 URL（Rust 端 option_env! 读取）
          QOOKIX_BUCKET_UPDATE_URL: ${{ secrets.QOOKIX_BUCKET_UPDATE_URL }}
        run: npm run tauri build

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Create portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "release/qookix-launcher.exe"
          if (-not (Test-Path $exe)) { throw "Binary not found: $exe" }
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "QookiX Launcher") | Out-Null
          Copy-Item $exe (Join-Path $stage "QookiX Launcher\") -Force
          $outDir = Join-Path $env:CARGO_TARGET_DIR "release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "QookiX_${ver}_x64_portable.zip"
          Compress-Archive -Path (Join-Path $stage "QookiX Launcher") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      # 只收真正的发布产物；bundle/** 里混有 AppImage/AppDir 的暂存文件不能发布
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find "$CARGO_TARGET_DIR/release/bundle" -maxdepth 5 -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.app.tar.gz' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \
            -o -name '*.exe' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp -n {} dist-artifacts/ \;
          echo "--- collected artifacts ---"
          ls -la dist-artifacts

      # 兜底：产物缺失在这里失败，而不是发出残缺的 release
      - name: Verify artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/verify-artifacts.mjs dist-artifacts ${{ matrix.artifact }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QookiX-${{ matrix.artifact }}
          path: dist-artifacts

  # 汇总三个平台产物，生成 latest.json 并发布 GitHub Release
  verify-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate update manifest (latest.json)
        run: |
          node scripts/create-update-manifest-local.mjs release "${GITHUB_REF_NAME}" latest.json

      - name: Generate release notes (download table)
        run: |
          node scripts/generate-release-notes.mjs release "${GITHUB_REF_NAME}" body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*
          body_path: body.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # 用 Release 实际 asset 的 URL 重建 latest.json，避免 Tauri 改名导致更新 404
      - name: Rebuild latest.json from published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          node scripts/fix-update-manifest.mjs

      # 转交产物给 push-bucket（GitHub 内网，秒级），两路发布互不阻塞
      - name: Upload release payload for bucket sync
        uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: release
          retention-days: 1

  # 推送更新产物到对象存储桶（「设置 → 更新源 → 对象存储」默认源）。
  # 需要配置 secrets：QOOKIX_BUCKET_UPDATE_URL / QOOKIX_S3_ENDPOINT /
  # QOOKIX_S3_BUCKET / QOOKIX_S3_ACCESS_KEY / QOOKIX_S3_SECRET_KEY，
  # 未配置时自动跳过。
  push-bucket:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: release

      - name: Push update artifacts to object storage bucket
        if: env.QOOKIX_BUCKET_UPDATE_URL != ''
        env:
          QOOKIX_BUCKET_UPDATE_URL: ${{ secrets.QOOKIX_BUCKET_UPDATE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.QOOKIX_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QOOKIX_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.QOOKIX_S3_ENDPOINT }}
          QOOKIX_S3_BUCKET: ${{ secrets.QOOKIX_S3_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          node scripts/create-bucket-manifest.mjs release "${GITHUB_REF_NAME}" bucket-latest.json
          cp bucket-latest.json release/latest.json
          node scripts/fetch-release-json.mjs release/release.json
          ENDPOINT_ARGS=""
          if [ -n "${AWS_ENDPOINT_URL}" ]; then ENDPOINT_ARGS="--endpoint-url ${AWS_ENDPOINT_URL}"; fi
          # 4 路并行上传，比 s3 sync 串行快数倍；
          # CRC32 是兼容端点（R2/MinIO）的要求，默认的 CRC64NVME 会报 invalid checksum
          find release -type f -print0 | xargs -0 -P 4 -I {} \
            aws $ENDPOINT_ARGS s3 cp {} "s3://${QOOKIX_S3_BUCKET}/" --no-progress --checksum-algorithm CRC32
          # 删除桶里本次 release 没有的旧版本文件（latest.json 每次覆盖，不受影响）
          aws $ENDPOINT_ARGS s3 ls "s3://${QOOKIX_S3_BUCKET}" --recursive \
            | awk '{print $4}' | sort -u > /tmp/remote-keys.txt
          find release -type f -printf '%f\n' | sort -u > /tmp/local-names.txt
          comm -23 /tmp/remote-keys.txt /tmp/local-names.txt > /tmp/stale-keys.txt
          if [ -s /tmp/stale-keys.txt ]; then
            echo "Removing stale objects:"
            cat /tmp/stale-keys.txt
            while IFS= read -r key; do
              [ -n "$key" ] && aws $ENDPOINT_ARGS s3 rm "s3://${QOOKIX_S3_BUCKET}/${key}"
            done < /tmp/stale-keys.txt
          fi
          echo "Uploaded update artifacts to ${QOOKIX_BUCKET_UPDATE_URL}"
