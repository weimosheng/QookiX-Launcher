name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qookix-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---------------------------------------------------------------------------
  # ONE cargo target dir shared by BOTH crates (the main app + installer-ui).
  # They depend on identical versions of tao / wry / windows, so without this
  # the whole GUI/webview block is compiled twice on Windows.
  #
  # NOTE: scripts/run-tauri.mjs and the steps below resolve paths through
  # $CARGO_TARGET_DIR, so changing this path requires no other edit.
  # ---------------------------------------------------------------------------
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target-shared
  # Release builds are incremental=false by default; make it explicit so the
  # shared target dir is not polluted with incremental state.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux
          - platform: windows-latest
            artifact: windows
          - platform: macos-latest
            artifact: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # sccache caches individual crate compilations keyed by their content.
      # Unlike Swatinem/rust-cache it is NOT scoped to the git ref, so a new
      # release tag can still reuse the compilation results of the previous one
      # (rust-cache cannot, which made every release a cold build).
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Still worth keeping for the cargo registry/git checkouts (~500MB,
      # restored in seconds) so we never re-download 880 crates.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-shared

      - name: Cache apt packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-webkit-ubuntu2204-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-webkit-ubuntu2204-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev

      # The windows-latest image already ships NSIS; only install it when the
      # binary is genuinely missing.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "NSIS already present: $((Get-Command makensis).Source)"
          } else {
            choco install nsis -y --no-progress
          }

      # `npm ci` instead of `npm install`: reproducible and ~2x faster.
      - name: Install frontend dependencies
        run: npm ci

      # Decode the Authenticode certificate (base64 -> .pfx). Skipped when the
      # secret is empty; code signing is then a no-op.
      - name: Decode code signing certificate
        if: runner.os == 'Windows' && env.QOOKIX_CERT_PFX_B64 != ''
        shell: bash
        env:
          QOOKIX_CERT_PFX_B64: ${{ secrets.QOOKIX_CERT_PFX_B64 }}
        run: |
          echo "$QOOKIX_CERT_PFX_B64" | base64 -d > "$RUNNER_TEMP/qookix.pfx"
          test -s "$RUNNER_TEMP/qookix.pfx"

      # Rust unit tests. lib.rs 的 smoke tests（Mojang/Fabric/Modrinth 实网
      # 请求）与 java_detection_report（需要 JVM）都在这里执行——
      # v0.4.53 的合并事故（fetch_news 被写成空 stub 未修复即发版）
      # 正是缺这一步才会漏过。
      - name: Setup Java (for Rust tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Rust tests
        # manifest 在 src-tauri/ 子目录；仓库根目录执行需显式指定。
        # 保持根目录 cwd，使 job 级 CARGO_TARGET_DIR（target-shared）与
        # sccache 共享目录和构建步骤保持一致。
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Advisory lint：只输出警告不阻断构建（代码库尚未清零 clippy 告警），
      # 让告警可见，为日后 -D warnings 做准备。
      - name: Clippy (advisory)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml

      # `npm run tauri build` runs the run-tauri.mjs wrapper: it builds the
      # WebView2 installer UI, embeds it, and (on Windows) signs the main exe /
      # installer / MSI. When TAURI_SIGNING_PRIVATE_KEY is set, the bundler
      # ALSO emits minisign `.sig` files for the updater artifacts, which the
      # publish job turns into latest.json.
      #
      # Per-platform bundle targets live in src-tauri/tauri.<os>.conf.json and
      # are merged automatically by the CLI.
      - name: Build Tauri app
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          QOOKIX_CERT_PFX: ${{ runner.temp }}/qookix.pfx
          QOOKIX_CERT_PASSWORD: ${{ secrets.QOOKIX_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 编译期注入存储桶更新源的公开根 URL（Rust 端 option_env! 读取）。
          # 未配置该 secret 时，应用内「对象存储」源会回退到占位地址。
          QOOKIX_BUCKET_UPDATE_URL: ${{ secrets.QOOKIX_BUCKET_UPDATE_URL }}
        run: npm run tauri build

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      # Extra Windows asset: a portable zip (the standalone exe) for users who
      # prefer not to run an installer.
      - name: Create portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "release/qookix-launcher.exe"
          if (-not (Test-Path $exe)) { throw "Binary not found: $exe" }
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "QookiX Launcher") | Out-Null
          Copy-Item $exe (Join-Path $stage "QookiX Launcher\") -Force
          $outDir = Join-Path $env:CARGO_TARGET_DIR "release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zip = Join-Path $outDir "QookiX_${ver}_x64_portable.zip"
          Compress-Archive -Path (Join-Path $stage "QookiX Launcher") -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Collect release artifacts
        shell: bash
        run: |
          # Copy ONLY the real release artifacts (installers, updater bundles,
          # signatures, portable zip) into dist-artifacts/. The raw
          # `bundle/**/*` glob also contains AppImage/AppDir staging files
          # (lib*.so, im-*.so, .desktop, copyright, data.tar.gz, the bare
          # binary, icon.icns, ...) which must NOT be published.
          mkdir -p dist-artifacts
          find "$CARGO_TARGET_DIR/release/bundle" -maxdepth 5 -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
            -o -name '*.app.tar.gz' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' \
            -o -name '*.exe' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp -n {} dist-artifacts/ \;
          echo "--- collected artifacts ---"
          ls -la dist-artifacts

      # Guard rail: if a bundle-target change ever drops the updater bundle or
      # every installer, fail HERE rather than publishing a broken release.
      - name: Verify artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/verify-artifacts.mjs dist-artifacts ${{ matrix.artifact }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QookiX-${{ matrix.artifact }}
          path: dist-artifacts

  # Assemble the GitHub Release once, after every platform finished. Downloads
  # all build artifacts (installers + updater bundles + `.sig` signatures),
  # generates the Tauri updater `latest.json` from local files, then publishes
  # everything in ONE `softprops/action-gh-release` call — the battle-tested
  # action that robustly creates/updates the release without the fragile manual
  # `gh release create/upload` dance that caused stale-release 404s.
  verify-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fail fast: a failure here (e.g. no signed bundles, or an unexpected
      # artifact layout) MUST fail the job, not silently ship a broken manifest.
      - name: Generate update manifest (latest.json)
        run: |
          node scripts/create-update-manifest-local.mjs release "${GITHUB_REF_NAME}" latest.json

      # Build a human-friendly release body: a per-platform download table whose
      # links point at the actual artifacts about to be published, so users can
      # grab the right installer directly from the release page.
      - name: Generate release notes (download table)
        run: |
          node scripts/generate-release-notes.mjs release "${GITHUB_REF_NAME}" body.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*
          body_path: body.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Rebuild latest.json from the release's REAL asset URLs (via the GitHub
      # API) and overwrite the placeholder generated above. This guarantees the
      # manifest always points at assets that actually exist on the release,
      # regardless of how Tauri names bundles (e.g. "QookiX Launcher" vs
      # "QookiX.Launcher" — Tauri replaces spaces with dots). Otherwise a
      # mismatched asset name makes the updater hit a 404 and every auto-update
      # fails.
      - name: Rebuild latest.json from published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          node scripts/fix-update-manifest.mjs

      # -----------------------------------------------------------------------
      # 推送更新产物到对象存储桶（「设置 → 更新源 → 对象存储」默认源）。
      #
      # 依赖 secrets（不配置则跳过上传，应用内对象存储源暂不可用）：
      #   QOOKIX_BUCKET_UPDATE_URL  更新目录的公开根 URL，如 https://cdn.example.com/qookix
      #   QOOKIX_S3_ENDPOINT         兼容 S3 的端点（AWS、Cloudflare R2、MinIO 等）
      #   QOOKIX_S3_BUCKET           存储桶名
      #   QOOKIX_S3_ACCESS_KEY / QOOKIX_S3_SECRET_KEY
      # -----------------------------------------------------------------------
      - name: Push update artifacts to object storage bucket
        if: env.QOOKIX_BUCKET_UPDATE_URL != ''
        env:
          QOOKIX_BUCKET_UPDATE_URL: ${{ secrets.QOOKIX_BUCKET_UPDATE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.QOOKIX_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QOOKIX_S3_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.QOOKIX_S3_ENDPOINT }}
          QOOKIX_S3_BUCKET: ${{ secrets.QOOKIX_S3_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TAG: ${{ github.ref_name }}
        run: |
          # 生成存储桶版 latest.json（每个平台 url 指向存储桶上的安装包）
          node scripts/create-bucket-manifest.mjs release "${GITHUB_REF_NAME}" bucket-latest.json
          cp bucket-latest.json release/latest.json
          # 镜像站 JSON：抓取 GitHub Release API 的完整响应（含全部 assets + 大小），
          # 让镜像站能展示该版本的所有安装包与大小。
          node scripts/fetch-release-json.mjs release/release.json
          # 把安装包、.sig 签名、latest.json 与 release.json 一起同步到存储桶根目录
          ENDPOINT_ARGS=""
          if [ -n "${AWS_ENDPOINT_URL}" ]; then ENDPOINT_ARGS="--endpoint-url ${AWS_ENDPOINT_URL}"; fi
          # 兼容端点（R2/MinIO 等）不支持 AWS CLI 新版默认的 CRC64NVME 校验和，
          # 显式用 CRC32，否则大文件（AppImage）分片上传会报 invalid checksum
          aws $ENDPOINT_ARGS s3 sync release/ "s3://${QOOKIX_S3_BUCKET}" --delete --no-progress --checksum-algorithm CRC32
          echo "Uploaded update artifacts to ${QOOKIX_BUCKET_UPDATE_URL}"
