[package]
name = "qookix-launcher"
version = "0.5.5"
description = "QookiX Launcher - a modern, clean and ad-free Minecraft launcher"
authors = ["QookiX"]
edition = "2021"
# 许可证字段待确定后补充，例如：license = "GPL-3.0-only"
repository = "https://github.com/weimosheng/QookiX-Launcher"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qookix_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "gzip", "brotli", "socks", "system-proxy"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v3", "v4"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
fastnbt = "2"
flate2 = "1"
tar = "0.4"
directories = "5"
percent-encoding = "2"
base64 = "0.22"
sysinfo = "0.30"
junction = "1"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
png = "0.17"

[profile.release]
strip = true
panic = "abort"
lto = "thin"
codegen-units = 1
incremental = false
