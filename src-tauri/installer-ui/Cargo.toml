[package]
name = "qookix-installer-ui"
version = "0.2.2"
description = "QookiX Launcher modern installer frontend (Windows only)"
edition = "2024"

# Produce a single `QookiXInstallerUI.exe` that the NSIS installer embeds and
# launches as the WebView2-based modern installer frontend. The actual
# installation work is performed by the NSIS installer itself running in
# silent mode.
[[bin]]
name = "QookiXInstallerUI"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
tao = "0.35"
wry = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
native-dialog = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
